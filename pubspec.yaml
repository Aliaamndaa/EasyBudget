name: smartattendface
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_commons: ^0.7.0
  uuid: ^4.3.1
  flutter_local_notifications: 14.0.0
  pie_chart: ^5.3.2
  fl_chart: ^0.66.1
  timezone: ^0.9.2
  convex_bottom_bar: ^3.0.0
  http: ^1.2.2
  intl: ^0.20.1
  shared_preferences: ^2.0.0
  image_picker: ^1.0.4
  google_mlkit_smart_reply: ^0.9.0
  permission_handler: ^10.0.0
  fluttertoast: ^8.0.9
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9 # Use the latest version from pub.dev
  url_launcher: ^6.2.5 # Use the latest version from pub.dev


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
